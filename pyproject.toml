[project]
name = "voice-flow-daemon"
version = "0.1.0"
description = "Apple Watch voice memo → STT + diarization → Claude summary → Notion"
requires-python = ">=3.12"

dependencies = [
    "watchdog>=4.0",
    "anthropic>=0.40",
    "notion-client>=2.2",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "mlx-whisper>=0.4",
    "pyannote.audio>=4.0",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
